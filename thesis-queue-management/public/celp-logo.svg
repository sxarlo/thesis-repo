<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="outerClip">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="98" fill="#B83B5E"/>
  <circle cx="100" cy="100" r="94" fill="#fff"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#B83B5E" stroke-width="1.5"/>
  <!-- School name around top arc -->
  <path id="topArc" d="M 30 100 A 70 70 0 0 1 170 100" fill="none"/>
  <text font-family="Georgia, serif" font-size="11.5" font-weight="700" fill="#B83B5E" letter-spacing="1.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">CENTRO ESCOLAR LAS PIÑAS</textPath>
  </text>
  <!-- Bottom text -->
  <path id="bottomArc" d="M 162 120 A 72 72 0 0 1 38 120" fill="none"/>
  <text font-family="Georgia, serif" font-size="10" font-weight="700" fill="#B83B5E" letter-spacing="1">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">SCIENCE AND VIRTUE</textPath>
  </text>
  <!-- Year -->
  <text x="100" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#B83B5E">1975</text>
  <!-- Inner circle background -->
  <circle cx="100" cy="95" r="50" fill="#6B6B6B"/>
  <!-- Shield -->
  <path d="M 100 55 L 75 72 L 75 105 Q 75 120 100 128 Q 125 120 125 105 L 125 72 Z" fill="#B83B5E" stroke="#fff" stroke-width="1"/>
  <!-- Shield left half overlay -->
  <path d="M 100 55 L 75 72 L 75 105 Q 75 120 100 128 Z" fill="#D4617A"/>
  <!-- Torch -->
  <rect x="96" y="68" width="8" height="22" rx="2" fill="#fff" opacity="0.9"/>
  <ellipse cx="100" cy="66" rx="5" ry="7" fill="#FFD700"/>
  <ellipse cx="100" cy="64" rx="3" ry="5" fill="#FFA500"/>
  <!-- Book -->
  <rect x="91" y="92" width="18" height="13" rx="1" fill="#fff" opacity="0.85"/>
  <line x1="100" y1="92" x2="100" y2="105" stroke="#B83B5E" stroke-width="0.8"/>
  <rect x="93" y="94" width="6" height="1.5" rx="0.5" fill="#B83B5E" opacity="0.5"/>
  <rect x="93" y="97" width="6" height="1.5" rx="0.5" fill="#B83B5E" opacity="0.5"/>
  <rect x="101" y="94" width="6" height="1.5" rx="0.5" fill="#B83B5E" opacity="0.5"/>
  <rect x="101" y="97" width="6" height="1.5" rx="0.5" fill="#B83B5E" opacity="0.5"/>
  <!-- Building (right side of shield) -->
  <rect x="107" y="76" width="14" height="18" rx="1" fill="#fff" opacity="0.8"/>
  <rect x="109" y="78" width="3" height="4" rx="0.5" fill="#B83B5E" opacity="0.6"/>
  <rect x="114" y="78" width="3" height="4" rx="0.5" fill="#B83B5E" opacity="0.6"/>
  <rect x="109" y="84" width="3" height="4" rx="0.5" fill="#B83B5E" opacity="0.6"/>
  <rect x="114" y="84" width="3" height="4" rx="0.5" fill="#B83B5E" opacity="0.6"/>
  <polygon points="107,76 114,70 121,76" fill="#fff" opacity="0.8"/>
  <!-- Pineapple (bottom right of shield) -->
  <ellipse cx="114" cy="104" rx="4" ry="5" fill="#FFD700" opacity="0.8"/>
  <line x1="114" y1="99" x2="114" y2="96" stroke="#228B22" stroke-width="1.5"/>
  <line x1="112" y1="99" x2="110" y2="96" stroke="#228B22" stroke-width="1"/>
  <line x1="116" y1="99" x2="118" y2="96" stroke="#228B22" stroke-width="1"/>
  <!-- Laurel branches left -->
  <g fill="none" stroke="#B83B5E" stroke-width="1.5" opacity="0.8">
    <path d="M 62 110 Q 55 95 58 78"/>
    <ellipse cx="56" cy="82" rx="4" ry="6" fill="#B83B5E" opacity="0.3" transform="rotate(-20 56 82)"/>
    <ellipse cx="54" cy="90" rx="4" ry="6" fill="#B83B5E" opacity="0.3" transform="rotate(-10 54 90)"/>
    <ellipse cx="55" cy="98" rx="4" ry="6" fill="#B83B5E" opacity="0.3" transform="rotate(0 55 98)"/>
    <ellipse cx="58" cy="106" rx="4" ry="5" fill="#B83B5E" opacity="0.3" transform="rotate(10 58 106)"/>
  </g>
  <!-- Laurel branches right -->
  <g fill="none" stroke="#B83B5E" stroke-width="1.5" opacity="0.8">
    <path d="M 138 110 Q 145 95 142 78"/>
    <ellipse cx="144" cy="82" rx="4" ry="6" fill="#B83B5E" opacity="0.3" transform="rotate(20 144 82)"/>
    <ellipse cx="146" cy="90" rx="4" ry="6" fill="#B83B5E" opacity="0.3" transform="rotate(10 146 90)"/>
    <ellipse cx="145" cy="98" rx="4" ry="6" fill="#B83B5E" opacity="0.3" transform="rotate(0 145 98)"/>
    <ellipse cx="142" cy="106" rx="4" ry="5" fill="#B83B5E" opacity="0.3" transform="rotate(-10 142 106)"/>
  </g>
</svg>